name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "HexCoach v__VERSION__"
          releaseBody: |
            HexCoach v__VERSION__ — League of Legends overlay coach.

            **Download the `.msi` installer below**, run it and launch **HexCoach**.
            No compilation, Node.js or Rust needed — the MSI bundles everything except the
            WebView2 runtime, which ships with Windows 11 and is already present on most Windows 10 installs.
            No Riot API key is included; add your own in Settings. Windows SmartScreen may warn about an
            unsigned build; choose "More info" → "Run anyway".

            ### Highlights
            - Global hotkeys, working even while League has keyboard focus
              - `Alt+X` compact / full overlay
              - `Alt+Z` dashboard click-through
              - `Alt+H` show / hide HexCoach
              - `Alt+C` in-game HUD interaction
            - Dark, light and OLED themes with a matching in-game HUD
            - Close to tray: the title bar X keeps HexCoach running next to the clock.
              Left-click the tray icon to restore it; the tray menu or Settings → Overlay → Quit stops it completely.
            - Draft helper (counters, synergies, estimated win rates)
            - Live game scoreboard, build, runes and skill order
            - Click-through in-game HUD with respawns, Flash timers and next item
            - Arena augment tier list and synergy reads
            - ARAM / ARAM Mayhem balance, builds and augment tiers
            - One-click rune import through the local League Client API

            Requires Windows 10/11 x64. HexCoach isn't endorsed by Riot Games.
          releaseDraft: false
          prerelease: false
          args: --bundles msi
