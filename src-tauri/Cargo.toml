[package]
name = "hexcoach"
version = "0.1.1"
description = "HexCoach — League of Legends overlay coach"
authors = ["Adam"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hexcoach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["time", "sync", "fs", "rt-multi-thread", "macros"] }
futures-util = "0.3"
thiserror = "2"
sysinfo = "0.33"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
