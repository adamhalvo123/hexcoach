<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <meta
      name="description"
      content="HexCoach — a lightning-fast League of Legends overlay with live builds, runes, draft helper and Arena augments."
    />
    <title>HexCoach</title>
    <script>
      // Apply the persisted theme before the first paint so the app never
      // flashes a light shell. Dark is the default.
      (() => {
        try {
          const stored = localStorage.getItem("hexcoach.theme.v1");
          const theme =
            stored === "light" || stored === "oled"
              ? stored
              : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", theme !== "light");
          document.documentElement.classList.toggle("theme-light", theme === "light");
          document.documentElement.classList.toggle("theme-oled", theme === "oled");
          document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
